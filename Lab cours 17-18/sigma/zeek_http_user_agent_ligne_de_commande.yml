title: Requête HTTP avec un User-Agent d'outil en ligne de commande (Zeek HTTP)
id: 0d9e7a4b-5c21-4f8e-b3d6-7a2e1c9f4e02
status: experimental
description: |
  Un poste fait une requête HTTP avec le User-Agent de PowerShell, curl, wget,
  BITS ou certutil. Ces outils servent souvent à télécharger la charge utile
  de la deuxième étape d'une infection.
author: SnailLabs
date: 2026-11-16
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  product: zeek
  service: http
detection:
  selection_source:
    event.dataset: zeek.http
  selection_ua:
    http.useragent|contains:
      - 'WindowsPowerShell'
      - 'curl/'
      - 'Wget'
      - 'Microsoft BITS'
      - 'CertUtil'
  condition: selection_source and selection_ua
falsepositives:
  - Scripts d'administration et outils de déploiement
level: medium

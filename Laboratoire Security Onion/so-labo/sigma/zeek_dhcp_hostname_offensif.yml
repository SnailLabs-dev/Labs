title: Hostname d'une distribution offensive annoncé en DHCP (Zeek DHCP)
id: 9a3c5e71-8b4d-4a2f-9c6e-1f7d2b8a5c03
status: experimental
description: |
  Une machine s'annonce sur le réseau avec le nom par défaut d'une
  distribution de tests d'intrusion (Kali, Parrot, BlackArch).
author: SnailLabs
date: 2026-11-16
tags:
  - attack.initial_access
logsource:
  product: zeek
  service: dhcp
detection:
  selection_source:
    event.dataset: zeek.dhcp
  selection_nom:
    host.hostname|contains:
      - 'kali'
      - 'parrot'
      - 'blackarch'
  condition: selection_source and selection_nom
falsepositives:
  - Postes de l'équipe de sécurité ou du laboratoire
level: medium
